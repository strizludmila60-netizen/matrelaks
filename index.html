<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Математичний релакс для учнів Терешківської школи: Черепашка-художник</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #F0F8FF;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #toolbar {
            height: 60px;
            background-color: #F0F8FF;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            padding: 8px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-sketch { background-color: #E6E6FA; }
        .btn-color { background-color: #98FB98; }
        .btn-sky { background-color: #87CEEB; }
        .btn-clear { background-color: #CD5C5C; color: white; margin-left: auto; }
        button:hover { opacity: 0.8; }
        
        #canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #F0F8FF;
        }
        canvas {
            background-color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <button class="btn-sketch" onclick="runSketch()">1. Намалювати ескіз</button>
        <button class="btn-color" onclick="runColor()">2. Розфарбувати</button>
        <button class="btn-sky" onclick="makeSkyBlue()">Змінити небо на вечірнє</button>
        <button class="btn-clear" onclick="clearCanvas()">Очистити все</button>
    </div>

    <div id="canvas-container">
        <canvas id="myCanvas" width="900" height="500"></canvas>
    </div>

<script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    let currentBgColor = "white";

    function clearCanvas() {
        ctx.fillStyle = currentBgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    clearCanvas();

    // 1. Сонце з променями
    function drawSun(x, y, isSketch) {
        ctx.beginPath();
        ctx.arc(x, y, 25, 0, Math.PI * 2);
        if (isSketch) {
            ctx.strokeStyle = "gray";
            ctx.lineWidth = 1;
            ctx.stroke();
        } else {
            ctx.fillStyle = "#FFF8DC";
            ctx.fill();
            ctx.strokeStyle = "#FFD700";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        for (let i = 0; i < 8; i++) {
            let angle = (i * 45) * Math.PI / 180;
            let x1 = x + Math.cos(angle) * 25;
            let y1 = y + Math.sin(angle) * 25;
            let x2 = x + Math.cos(angle) * 40;
            let y2 = y + Math.sin(angle) * 40;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = isSketch ? "gray" : "#FFA500";
            ctx.lineWidth = isSketch ? 1 : 3;
            ctx.stroke();
        }
    }

    // 2. Човен із правильною трапецією
    function drawBoat(x, y, isSketch) {
        // Корпус човна (широка основа вгорі)
        ctx.beginPath();
        ctx.moveTo(x - 40, y);
        ctx.lineTo(x + 120, y);
        ctx.lineTo(x + 90, y + 45);
        ctx.lineTo(x - 10, y + 45);
        ctx.closePath();

        if (isSketch) {
            ctx.strokeStyle = "gray";
            ctx.lineWidth = 1;
            ctx.stroke();
        } else {
            ctx.fillStyle = "#D2B48C";
            ctx.fill();
            ctx.strokeStyle = "#8B4513";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // Щогла
        ctx.beginPath();
        ctx.moveTo(x + 40, y);
        ctx.lineTo(x + 40, y - 80);
        ctx.strokeStyle = isSketch ? "gray" : "#8B4513";
        ctx.lineWidth = isSketch ? 1 : 3;
        ctx.stroke();

        // Вітрило
        ctx.beginPath();
        ctx.moveTo(x + 40, y - 80);
        ctx.lineTo(x + 95, y - 35);
        ctx.lineTo(x + 40, y - 10);
        ctx.closePath();

        if (isSketch) {
            ctx.strokeStyle = "gray";
            ctx.lineWidth = 1;
            ctx.stroke();
        } else {
            ctx.fillStyle = "#FFA07A";
            ctx.fill();
            ctx.strokeStyle = "#FF4500";
            ctx.lineWidth = 3;
            ctx.stroke();
        }
    }

    // 3. Виразний кит з хвостом, оком і фонтанчиком
    function drawWhale(x, y, isSketch) {
        // Тіло кита
        ctx.beginPath();
        ctx.arc(x, y, 55, Math.PI, 0, false);
        ctx.lineTo(x + 55, y + 10);
        ctx.lineTo(x - 55, y + 10);
        ctx.closePath();

        if (isSketch) {
            ctx.strokeStyle = "gray";
            ctx.lineWidth = 1;
            ctx.stroke();
        } else {
            ctx.fillStyle = "#3CB371";
            ctx.fill();
            ctx.strokeStyle = "#2E8B57";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // Хвіст кита
        ctx.beginPath();
        ctx.moveTo(x + 50, y + 5);
        ctx.lineTo(x + 85, y - 15);
        ctx.lineTo(x + 75, y + 10);
        ctx.lineTo(x + 85, y + 35);
        ctx.closePath();

        if (isSketch) {
            ctx.strokeStyle = "gray";
            ctx.lineWidth = 1;
            ctx.stroke();
        } else {
            ctx.fillStyle = "#3CB371";
            ctx.fill();
            ctx.strokeStyle = "#2E8B57";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        if (!isSketch) {
            // Око
            ctx.beginPath();
            ctx.arc(x - 30, y - 20, 7, 0, Math.PI * 2);
            ctx.fillStyle = "white";
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(x - 32, y - 20, 3, 0, Math.PI * 2);
            ctx.fillStyle = "black";
            ctx.fill();

            // Фонтанчик води
            ctx.beginPath();
            ctx.moveTo(x - 10, y - 55);
            ctx.quadraticCurveTo(x - 25, y - 85, x - 35, y - 75);
            ctx.moveTo(x - 10, y - 55);
            ctx.quadraticCurveTo(x, y - 90, x + 5, y - 80);
            ctx.strokeStyle = "#00BFFF";
            ctx.lineWidth = 2;
            ctx.stroke();
        } else {
            // Фонтанчик для ескізу
            ctx.beginPath();
            ctx.moveTo(x - 10, y - 55);
            ctx.lineTo(x - 20, y - 75);
            ctx.moveTo(x - 10, y - 55);
            ctx.lineTo(x - 5, y - 80);
            ctx.strokeStyle = "gray";
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

    // 4. Хвилі
    function drawWave(x, y, isSketch) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        for (let i = 0; i < 7; i++) {
            ctx.bezierCurveTo(x + 10 + i*40, y - 20, x + 30 + i*40, y - 20, x + 40 + i*40, y);
        }
        ctx.strokeStyle = isSketch ? "gray" : "#1E90FF";
        ctx.lineWidth = isSketch ? 1 : 2;
        ctx.stroke();
    }

    // Дії кнопок
    function runSketch() {
        clearCanvas();
        drawSun(150, 100, true);
        drawWave(80, 360, true);
        drawBoat(300, 320, true);
        drawWhale(620, 320, true);
    }

    function runColor() {
        drawSun(150, 100, false);
        drawWave(80, 360, false);
        drawBoat(300, 320, false);
        drawWhale(620, 320, false);
    }

    function makeSkyBlue() {
        currentBgColor = "#E0FFFF";
        clearCanvas();
        runColor();
    }
</script>
</body>
</html>
